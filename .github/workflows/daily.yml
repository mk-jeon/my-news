name: daily-brief
on:
  schedule:
    # GitHub 예약 실행은 늦거나 통째로 빠질 때가 있어서 여러 번 걸어 두고, 그날 처음 성공한 한 번만 일한다.
    - cron: '13 20 * * *'  # 05:13 KST
    - cron: '43 20 * * *'
    - cron: '13 21 * * *'
    - cron: '43 21 * * *'
    - cron: '13 22 * * *'  # 07:13 KST (마지막 보험)
  workflow_dispatch:
    inputs:
      notify: { description: '수동 실행 때도 알림 보내기', type: boolean, default: false }
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: daily-brief, cancel-in-progress: false }
jobs:
  gate:
    runs-on: ubuntu-latest
    outputs: { skip: '${{ steps.g.outputs.skip }}' }
    steps:
      - uses: actions/checkout@v4
      - id: g
        run: |
          # 예약 실행: 오늘(KST) 아침 브리프를 이미 보냈으면 건너뜀
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$(cat docs/data/morning.txt 2>/dev/null)" = "$(TZ=Asia/Seoul date +%F)" ]; then
            echo skip=true >> "$GITHUB_OUTPUT"
          fi
  brief:
    needs: gate
    if: needs.gate.outputs.skip != 'true'
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run collect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
      - name: 날짜별 데이터 커밋 (아카이브 + 60일 비활성 cron 정지 방지)
        run: |
          git config user.name "mark-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          [ "${{ github.event_name }}" = "schedule" ] && TZ=Asia/Seoul date +%F > docs/data/morning.txt
          git add docs/data
          git diff --cached --quiet || git commit -m "brief: $(TZ=Asia/Seoul date +%F)"
          git pull --rebase -q origin main
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: 알림 (배포 후, 06:00 KST 까지 대기)
        if: github.event_name == 'schedule' || inputs.notify
        run: |
          # 예약 실행일 때만 06:00 KST(21:00 UTC) 까지 기다린다. 이미 지났으면 바로 보냄.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            wait=$(( $(date -u -d '21:00' +%s) - $(date -u +%s) ))
            [ $wait -gt 0 ] && [ $wait -lt 7200 ] && echo "wait ${wait}s" && sleep $wait
          fi
          npm run push
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
