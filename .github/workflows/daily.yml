name: daily-brief
on:
  schedule:
    - cron: '30 20 * * *'  # 05:30 KST 시작 (GitHub cron 은 수십 분 늦을 수 있어 여유를 둠)
  workflow_dispatch:
    inputs:
      notify: { description: '수동 실행 때도 알림 보내기', type: boolean, default: false }
permissions:
  contents: write
  pages: write
  id-token: write
concurrency: { group: daily-brief, cancel-in-progress: false }
jobs:
  brief:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: '${{ steps.deploy.outputs.page_url }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run check
      - run: npm run collect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
      - name: 날짜별 데이터 커밋 (아카이브 + 60일 비활성 cron 정지 방지)
        run: |
          git config user.name "mark-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet || git commit -m "brief: $(TZ=Asia/Seoul date +%F)"
          git pull --rebase -q origin main
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: docs }
      - id: deploy
        uses: actions/deploy-pages@v4
      - name: 알림 (배포 후, 06:00 KST 까지 대기)
        if: github.event_name == 'schedule' || inputs.notify
        run: |
          # 예약 실행일 때만 06:00 KST(21:00 UTC) 까지 기다린다. 이미 지났으면 바로 보냄.
          if [ "${{ github.event_name }}" = "schedule" ]; then
            wait=$(( $(date -u -d '21:00' +%s) - $(date -u +%s) ))
            [ $wait -gt 0 ] && [ $wait -lt 7200 ] && echo "wait ${wait}s" && sleep $wait
          fi
          npm run push
        env:
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          PUSH_SUBSCRIPTIONS: ${{ secrets.PUSH_SUBSCRIPTIONS }}
